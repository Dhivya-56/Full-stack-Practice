<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"

    />

    <title>Hello, world!</title>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
      <div class="container">
        <a href="#" class="navbar-brand fw-bold text-primary">

        <!-- Corrected Navbar Toggle Button -->
        <button

          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"

        </button>

        <!-- Navbar Items (Now outside the button) -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#features">Features</a>
            </li>
            <li class="nav-item">

            <li class="nav-item">

    <section class="hero-section text-white d-flex align-items-center" style="height: 100vh; background-color: #007bff;">

        <div class="row justify-content-center">
          <div class="col-lg-6">

            </p>

              <a href="#contact" class="btn btn-light btn-lg w-100 w-sm-auto">Get Started</a>
            </div>

            </div>
          </div>

      </div>

    <script

      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
